<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Midnight at the Bakery</title>
<style>
:root{color-scheme:light;--pink:#df438e;--green:#1c9b57;--page:#092e40;--paper:#e8faf8;--accent:#2c9e9a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0,var(--page),#101b2b 95%);color:#39251c;font-family:Arial,sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer;border:1px solid #ffffff44;background:var(--page);color:#fff7e8;border-radius:10px;padding:12px 19px;font-weight:700}
button:hover{filter:brightness(1.16)}
button:focus-visible,input:focus-visible,[data-t]:focus-visible{outline:3px solid #e6aa28;outline-offset:4px}
button:disabled{opacity:.4;cursor:default}
.primary{background:linear-gradient(135deg,var(--accent),var(--page));border-color:var(--accent);box-shadow:0 4px 16px #17283724}
.small{padding:9px 12px;font-size:14px}
header{color:#fff3df;max-width:1170px;margin:auto;padding:20px 25px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{font-size:17px;font-weight:900;letter-spacing:3px}.brand span{color:#b7f5eb}
.header-actions{display:flex;gap:9px}
.tag{font-size:12px;color:var(--accent);letter-spacing:3px;text-transform:uppercase}
#theater{position:relative;max-width:1120px;height:300px;margin:0 auto 18px;overflow:hidden;border:2px solid var(--accent);border-radius:18px;box-shadow:0 20px 65px #0007}
#scene{position:absolute;inset:0;width:100%;height:100%}
.scene-label{position:absolute;left:24px;top:20px;color:#fff4d7;text-shadow:0 2px 5px #000;background:#102432d9;padding:10px 15px;border-left:3px solid #f1d191;pointer-events:none}
.scene-label span{display:block;font-family:Georgia,serif;font-size:20px;letter-spacing:2px}
.scene-label small{display:block;font-size:12px;margin-top:5px;color:#d3e5df}
.scene-badge{position:absolute;right:20px;top:22px;border:1px solid #e9d7aa;background:var(--page);color:#ffe9b5;border-radius:30px;padding:10px 15px;font-size:13px;font-weight:bold}
.hero{max-width:880px;margin:0 auto 30px;padding:22px 32px 30px;text-align:center;background:var(--paper);border:1px solid var(--accent);box-shadow:0 25px 100px #0007;border-radius:20px}
.hero h1{font-family:Georgia,serif;font-size:55px;letter-spacing:2px;margin:18px 0 5px;color:var(--page)}
.hero h2{font-size:26px;font-weight:400;color:#374654;margin:6px 0 20px}
.hero p{font-size:18px;line-height:1.65;color:#374654;max-width:690px;margin:18px auto}
.instructions{text-align:left;max-width:650px;margin:22px auto;padding:5px 0}
.instructions div{padding:10px 0;font-size:17px;line-height:1.5;border-bottom:1px solid #35556625}
.instructions b{color:#374654}
.hero .primary{font-size:20px;padding:16px 35px;margin:14px 0}
.progress{max-width:1120px;margin:0 auto 15px;padding:0 18px;display:grid;grid-template-columns:repeat(10,1fr);gap:9px}
.node{height:7px;border-radius:6px;background:#e0f4ff33}
.node.done{background:#8cf9b0;box-shadow:0 0 12px #62e8bb66}
.node.active{background:#f3d7a2;box-shadow:0 0 15px #f4bc71}
.console{max-width:1120px;margin:0 auto 30px;padding:26px 32px;background:var(--paper);border:1px solid var(--accent);border-radius:16px;box-shadow:0 20px 100px #0007}
.mission-head{display:flex;align-items:center;justify-content:space-between;gap:15px}
.mission-head h1{font-size:clamp(23px,4vw,32px);margin:7px 0 15px}
.sector{color:#536779;font-size:14px;letter-spacing:1px}
.chapter{font-size:16px;line-height:1.65;color:#374654;padding:12px 15px;background:color-mix(in srgb,var(--accent) 15%,var(--paper));border-radius:7px;margin:2px 0 13px}
.chapter-label{display:block;font-size:10px;font-weight:900;letter-spacing:2px;margin-bottom:4px;color:var(--accent)}
.story{font-size:clamp(21px,2.55vw,28px);line-height:1.85;margin:7px 0;padding:14px 17px;background:color-mix(in srgb,var(--accent) 5%,var(--paper));border-left:3px solid var(--accent);user-select:none}
.question{font-size:clamp(21px,2.55vw,28px);line-height:1.8;padding:7px 17px 16px}
.story [data-t],.question [data-t]{display:inline-block;position:relative;padding:0 6px;cursor:crosshair;border-radius:4px;touch-action:none}
.marked:after{content:"";position:absolute;inset:3px -2px;border:3px solid var(--pink);border-radius:50%;pointer-events:none;transform:rotate(-3deg)}
.marked.green:after{border-color:var(--green);transform:rotate(2deg)}
.tools{display:flex;gap:13px;align-items:center;flex-wrap:wrap;padding:14px 0;margin-bottom:6px}
.ring-tool{display:flex;gap:10px;align-items:center;padding:9px 14px;touch-action:none}
.ring-icon{width:50px;height:27px;border:3px solid #ff8cc0;border-radius:50%;display:inline-block;transform:rotate(-7deg)}
.green-ring{border-color:#86efac}.ring-tool.selected{box-shadow:0 0 0 2px var(--accent)}
.tool-help{color:#536779;font-size:14px;line-height:1.6;flex:1;min-width:210px}.mark-count{font-size:13px}
.ghost{position:fixed;z-index:30;width:86px;height:40px;border:4px solid var(--pink);border-radius:50%;pointer-events:none;transform:translate(-50%,-50%)}
.answer-area{padding:19px 0 0;border-top:1px solid #45677940}
.answer-row{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-top:12px}
.field{display:flex;flex-direction:column;gap:9px;flex:1;min-width:180px}
.field label{font-size:17px;font-weight:700;color:#374654}
.field input,.code-input{border:1px solid var(--accent);background:#ffffffd9;color:#243743;padding:13px 15px;border-radius:9px;font-size:27px;min-width:0;width:100%}
.step-prompt{margin:5px 0 0;font-size:18px;line-height:1.6;color:#374654}
.step-done{padding:11px 15px;background:#3b9a7015;color:#215f46;border-left:3px solid #70b48e;margin:0 0 16px;line-height:1.6}
.locked{color:#536779;border:1px dashed #66778866;padding:14px;margin-top:17px;border-radius:9px;line-height:1.5}
.feedback{min-height:28px;margin:15px 0 0;font-size:17px;line-height:1.6;color:#913c27}.feedback.good{color:#246947}
.bottom{font-size:13px;color:#536779;margin-top:12px}
.modal-backdrop{position:fixed;inset:0;background:#000c;z-index:40;display:grid;place-items:center;padding:20px}
.modal{background:var(--paper);border:1px solid var(--accent);border-radius:20px;max-width:750px;width:100%;padding:30px;box-shadow:0 0 90px #0004;max-height:90vh;overflow:auto}
.modal h2{font-size:29px;margin:0 0 12px}.reward{text-align:center}.reward p{font-size:18px;line-height:1.6}
.code{font-size:70px;color:var(--page);letter-spacing:18px;font-weight:900;margin:18px 0 10px}
.ledger-grid,.code-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0}
.ledger-item{padding:15px 5px;border:1px solid #65798b44;border-radius:9px;text-align:center}
.ledger-item small{display:block;color:#536779;margin-bottom:9px}.ledger-item strong{font-size:23px;letter-spacing:4px}
.code-grid label{font-size:13px;color:#536779}.code-input{font-size:23px;letter-spacing:4px;margin-top:8px;text-align:center;padding:12px 4px}
.muted{color:#536779}.flex{display:flex;gap:12px;flex-wrap:wrap}
.reward-seal{width:118px;height:118px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;background:repeating-conic-gradient(#f5d998 0deg 10deg,#b9853c 10deg 20deg);box-shadow:0 0 0 5px #d6a85f55,0 10px 25px #704b3333;animation:sealArrival 1s cubic-bezier(.2,.8,.2,1)}
.seal-core{width:90px;height:90px;display:grid;place-items:center;border:3px double #9b6d2f;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff4c6,#d7a74e);font-family:Georgia,serif;font-size:48px;color:#77501f}
@keyframes sealArrival{from{transform:translateY(60px) rotate(-140deg) scale(.15);opacity:0}to{transform:none;opacity:1}}
body.escaped{overflow:hidden}body.escaped header,body.escaped .scene-label,body.escaped .scene-badge{display:none}
body.escaped #theater{position:fixed;inset:0;max-width:none;height:100vh;margin:0;border:0;border-radius:0}
.escape-cinema{position:fixed;inset:0;z-index:5;display:grid;place-items:center;perspective:1500px}
.door-frame{position:absolute;inset:0;perspective:1200px;pointer-events:none}
.door-leaf{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#392a24,#77503b 14%,#a67549 49%,#67442e 94%,#30231e);border:10px ridge #95643c;box-shadow:inset 0 0 60px #24190eaa,0 0 50px #0009;backface-visibility:hidden;animation:doorOpen 3.8s cubic-bezier(.4,0,.2,1) .7s forwards}
.door-leaf.left{left:0;transform-origin:left center;--swing:-105deg}.door-leaf.right{right:0;transform-origin:right center;--swing:105deg}
.door-glass{position:absolute;inset:8% 14% 37%;border:10px ridge #b88c56;background:linear-gradient(125deg,#1a2836da,#567780b3 40%,#d5bd8d99);box-shadow:inset 0 0 30px #0f1b23}
.door-glass:after{content:'SUGAR & STARS';position:absolute;inset:30% 0;text-align:center;color:#f8deb0;font-family:Georgia,serif;font-size:clamp(13px,3vw,32px);letter-spacing:3px}
.door-panel{position:absolute;inset:68% 14% 8%;border:12px ridge #9d7246;box-shadow:inset 0 0 30px #382519}
.door-handle{position:absolute;top:53%;width:13px;height:80px;border-radius:20px;background:linear-gradient(90deg,#7b5329,#ffe9aa,#9f7338);box-shadow:4px 6px 8px #0006}
.left .door-handle{right:7%}.right .door-handle{left:7%}
@keyframes doorOpen{to{transform:rotateY(var(--swing));opacity:.2}}
.escape-message{position:relative;text-align:center;max-width:780px;margin:20px;padding:28px 35px;border:1px solid #f8e0aa;background:#fff7e9eb;border-radius:20px;box-shadow:0 20px 80px #51371e77;animation:escapeArrival 1.5s ease 3.2s both}
.escape-message h1{font-family:Georgia,serif;font-size:clamp(34px,6vw,68px);color:#704125;margin:10px 0}
.escape-message p{font-size:19px;line-height:1.6}.escape-message .ending{font-size:17px;color:#795b47}
.ribbon{display:inline-block;padding:12px 24px;background:#43715b;color:#fff5d9;letter-spacing:3px;font-size:14px;margin:10px 0;border:3px double #a9c4a4}
@keyframes escapeArrival{from{opacity:0;transform:translateY(40px) scale(.9)}to{opacity:1;transform:none}}
.at-door #theater{height:330px}
@media(max-width:680px){
header{padding:14px;flex-wrap:wrap}.brand{font-size:15px;letter-spacing:2px}.header-actions{gap:5px;margin-left:auto}.header-actions button{font-size:12px;padding:8px}
#theater{height:240px;margin:0 10px 13px}.at-door #theater{height:260px}.scene-label{left:12px;top:12px;padding:8px}.scene-label span{font-size:15px}.scene-label small{max-width:170px;font-size:10px}.scene-badge{right:10px;top:12px;padding:8px;font-size:11px}
.hero{margin:0 10px 20px;padding:22px 18px}.hero h1{font-size:40px}.hero h2{font-size:22px}.console{margin:0 10px 20px;padding:18px 15px}.chapter{font-size:15px}
.story,.question{padding-left:10px;padding-right:8px;line-height:2}.tools{gap:9px}.ring-tool{font-size:13px;padding:9px}.ring-icon{width:34px;height:24px}.tool-help{flex-basis:100%}
.ledger-grid,.code-grid{grid-template-columns:repeat(2,1fr)}.modal{padding:22px}.code{font-size:57px}.mission-head{align-items:start}.answer-row button{width:100%}.escape-message{padding:22px 18px;margin:15px}.escape-message p{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}.door-leaf{animation:doorOpen .01s forwards!important}.escape-message{animation:none!important}}
</style>
</head>
<body>
<header><div class="brand">MIDNIGHT <span>BAKERY</span></div><div class="header-actions"><button class="small" id="sound">Sound: on</button><button class="small" id="log">Code log</button><button class="small" id="restart">Restart</button></div></header>
<section id="theater" aria-label="Animated bakery scene"><canvas id="scene" aria-hidden="true"></canvas><div class="scene-label"><span id="sceneTitle">SUGAR & STARS BAKERY</span><small id="sceneCaption">A midnight mystery is about to begin</small></div><div class="scene-badge" id="sealCount">0 / 10 seals</div></section>
<main id="app"></main><div id="overlay"></div>
<script>
(()=>{
'use strict';
const missions=[
{room:'Bread Counter',title:'Unlock the bread counter',story:'A bakery made {268 rolls} in the morning and {157 rolls} in the afternoon.',question:'How many {rolls} did the bakery make in all?',answer:425,code:'731'},
{room:'Cookie Case',title:'Open the cookie case',story:'A bakery had a total of {742 cookies}. Customers bought {286 cookies}.',question:'How many {cookies} does the bakery have left?',answer:456,code:'284'},
{room:'Dessert Cart',title:'Release the dessert cart',story:'A dessert cart earned {$235 in sales} on Friday and {$186 in sales} on Saturday.',question:'How much {money} did the cart make both days?',answer:421,code:'956'},
{room:'Muffin Rack',title:'Unlock the muffin rack',story:'A baker made {624 muffins} on Monday and {358 muffins} on Tuesday.',question:'How many more {muffins} did the baker make on Monday than on Tuesday?',answer:266,code:'413'},
{room:'Recipe Cabinet',title:'Open the recipe cabinet',story:'A bakery made {900 cookies}. Of those, {245 cookies} were chocolate chip and {178 cookies} were oatmeal. The rest were sugar cookies.',question:'How many {sugar cookies} were there?',step:'How many chocolate chip and oatmeal cookies were there in all?',first:423,answer:477,code:'862'},
{room:'Bagel Basket',title:'Unlock the bagel basket',story:'A bakery had {356 bagels}. A baker made {278 bagels}. Customers bought {419 bagels}.',question:'How many {bagels} does the bakery have left?',step:'How many bagels did the bakery have before customers bought any?',first:634,answer:215,code:'597'},
{room:'Packing Station',title:'Release the packing station',story:'A bakery had {725 cupcake boxes}. Workers used {368 cupcake boxes}. Then a delivery brought {246 cupcake boxes}.',question:'How many {cupcake boxes} does the bakery have now?',step:'How many cupcake boxes were left after workers used some, before the delivery?',first:357,answer:603,code:'148'},
{room:'Pie Display',title:'Unlock the pie display',story:'A bakery sold {328 pies} on Friday and {259 pies} on Saturday.',question:'How many {pies} did the bakery sell both days?',answer:587,code:'625'},
{room:'Cupcake Stand',title:'Open the cupcake stand',story:'A bakery had a total of {700 cupcakes}. Customers bought {247 cupcakes}.',question:'How many {cupcakes} does the bakery have left?',answer:453,code:'379'},
{room:'Front Counter',title:'Find the final door code',story:'A bakery had {1,000 pastries}. It sold {276 pastries} on Friday and {348 pastries} on Saturday.',question:'How many {pastries} does the bakery have left?',step:'How many pastries did the bakery sell both days?',first:624,answer:376,code:'804'}
];
const chapters=[
'The midnight bell rings. A brass lock clicks shut on the bread counter. A folded note says: Begin where the fresh rolls cool.',
'A tiny drawer slides open beneath the bread counter. Inside is a clue: The cookie case holds the next recipe seal.',
'Behind the cookie tray, you discover a golden wheel. It fits the dessert cart, but its number lock is still closed.',
'The cart rolls aside to reveal a narrow passage. At the end, the muffin rack glows beneath a copper lamp.',
'A recipe card flutters out from the muffin rack. Its flour-dusted arrow points toward a locked oak cabinet.',
'The cabinet opens with a warm wooden creak. Inside, a note reads: Your next seal waits beside the bagel baskets.',
'A paper trail leads from the bagel baskets to the packing table. Someone has hidden a seal beneath a stack of bakery boxes.',
'As the packing station opens, a little bell chimes. The pie display turns slowly, revealing another brass lock.',
'The pie stand reveals a silver cake server. Engraved on its handle: Look beneath the tallest cupcake stand.',
'Nine seals shimmer in your recipe book. One final lock waits at the front counter. Beyond it, the front door begins to glow.'
];
const themes=[
['#143d62','#eaf5ff','#213f60','#4b91c1'],
['#65364f','#fff0f7','#78445c','#b95381'],
['#423369','#f3efff','#594574','#8c6db8'],
['#6c3542','#fff0e9','#8e4f48','#bc6658'],
['#264d3e','#edf8ee','#3f6650','#5b8e60'],
['#194f59','#e8fbfa','#2b6972','#3b99a1'],
['#35456d','#eef1ff','#4e6093','#6b7fbd'],
['#6b3457','#fff0f9','#86466c','#b96292'],
['#555225','#fffde6','#736d3b','#958a39'],
['#204658','#edfaff','#38687d','#4e98b3']
];
const $=id=>document.getElementById(id),app=$('app'),overlay=$('overlay');
let state={index:0,codes:[],stage:1,started:false,escaped:false,marks:[]},selected='pink',soundOn=true,sceneIndex=0,launch=false,rewardAt=-100,escapeAt=0;
const storage='midnight-bakery-word-missions-v2';
function setTheme(){
 const v=state.started?themes[Math.min(state.index,9)]:['#092e40','#e8faf8','#174758','#2c9e9a'],r=document.documentElement;
 r.style.setProperty('--page',v[0]);r.style.setProperty('--paper',v[1]);r.style.setProperty('--accent',v[3]);
}
function save(){try{localStorage.setItem(storage,JSON.stringify(state))}catch(e){}}
try{
 const v=JSON.parse(localStorage.getItem(storage)||'null');
 if(v&&Number.isInteger(v.index)&&v.index>=0&&v.index<=10&&Array.isArray(v.codes)&&v.codes.length===v.index&&v.codes.every((c,i)=>c===missions[i].code)&&(!v.escaped||v.index===10)){
  state={...state,...v};if(state.stage!==2)state.stage=1;if(!Array.isArray(state.marks))state.marks=[];if(state.index<10&&!missions[state.index].first)state.stage=1;
 }
}catch(e){}
let audio;
function tone(kind){
 if(!soundOn)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();audio.resume();
  const now=audio.currentTime,notes=kind==='win'?[261.63,329.63,392,523.25]:kind==='step'?[329.63,440,554.37]:[146.83,174.61];
  notes.forEach((f,i)=>{
   const o=audio.createOscillator(),g=audio.createGain();o.type='triangle';o.frequency.value=f;
   g.gain.setValueAtTime(0,now+i*.09);g.gain.linearRampToValueAtTime(.045,now+i*.09+.025);g.gain.exponentialRampToValueAtTime(.0001,now+i*.09+(kind==='win'?1.5:.65));
   o.connect(g);g.connect(audio.destination);o.start(now+i*.09);o.stop(now+i*.09+1.6);
  });
 }catch(e){}
}
function msg(t,good=false){const f=$('feedback');if(f){f.textContent=t;f.className='feedback'+(good?' good':'');f.scrollIntoView({block:'nearest',behavior:'smooth'});}}
function targetText(t,type){let n=0;return t.replace(/\{([^}]+)\}/g,(_,s)=>`<span tabindex="0" data-t="${type}${n++}" data-color="${type==='n'?'pink':'green'}">${s}</span>`);}
function expectedMarks(){return [...document.querySelectorAll('[data-t]')].map(x=>x.dataset.t)}
function applyMarks(){
 document.querySelectorAll('[data-t]').forEach(el=>{el.classList.toggle('marked',state.marks.includes(el.dataset.t));el.classList.toggle('green',el.dataset.color==='green');});
 const c=$('markCount');if(c)c.textContent=`${state.marks.length} of ${expectedMarks().length} circles placed`;
}
function mark(el,color){
 if(!el)return;if(color!==el.dataset.color){msg('Use pink for a number with its noun. Use green for what the question asks you to find.');return;}
 if(!state.marks.includes(el.dataset.t)){state.marks.push(el.dataset.t);tone('step');}
 applyMarks();save();msg('Circle placed. You can drag a placed circle to move it.');
}
function choose(color){selected=color;document.querySelectorAll('.ring-tool').forEach(b=>{b.classList.toggle('selected',b.dataset.color===color);b.setAttribute('aria-pressed',String(b.dataset.color===color));});}
let drag=null;
function startDrag(e,color,origin=null){
 if(e.button!==undefined&&e.button!==0)return;e.preventDefault();choose(color);
 const g=document.createElement('div');g.className='ghost';g.style.borderColor=color==='green'?'var(--green)':'var(--pink)';g.style.left=e.clientX+'px';g.style.top=e.clientY+'px';document.body.append(g);
 drag={g,color,origin,x:e.clientX,y:e.clientY,moved:false};
}
document.addEventListener('pointermove',e=>{
 if(!drag)return;drag.g.style.left=e.clientX+'px';drag.g.style.top=e.clientY+'px';drag.moved=drag.moved||Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>8;
},{passive:true});
document.addEventListener('pointerup',e=>{
 if(!drag)return;const d=drag;drag=null;d.g.remove();const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-t]');
 if(d.origin&&!d.moved)return;
 if(el){if(el.dataset.color===d.color&&d.origin&&d.origin!==el.dataset.t)state.marks=state.marks.filter(t=>t!==d.origin);mark(el,d.color);}
 else if(d.origin&&d.moved){state.marks=state.marks.filter(t=>t!==d.origin);applyMarks();save();}
},{passive:true});
document.addEventListener('pointercancel',()=>{if(drag){drag.g.remove();drag=null;}});
function bindMarking(){
 document.querySelectorAll('.ring-tool').forEach(b=>{b.onpointerdown=e=>startDrag(e,b.dataset.color);b.onclick=()=>choose(b.dataset.color);});
 document.querySelectorAll('[data-t]').forEach(el=>{
  el.onpointerdown=e=>{if(state.marks.includes(el.dataset.t))startDrag(e,el.dataset.color,el.dataset.t);else{e.preventDefault();mark(el,selected);}};
  el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();mark(el,selected);}};
 });
 $('clear').onclick=()=>{state.marks=[];applyMarks();save();msg('Circles cleared.');};applyMarks();
}
function render(){
 setTheme();overlay.innerHTML='';document.body.classList.toggle('escaped',!!state.escaped);document.body.classList.toggle('at-door',state.index===10&&!state.escaped);
 $('sceneTitle').textContent=state.started?(state.index<10?missions[state.index].room.toUpperCase():'THE FRONT DOOR'):'SUGAR & STARS BAKERY';
 $('sceneCaption').textContent=state.started?'Explore the bakery. Recover the missing recipe seals.':'A midnight mystery is about to begin';
 $('sealCount').textContent=state.codes.length+' / 10 seals';$('log').disabled=!state.started;$('restart').disabled=!state.started;sceneIndex=Math.min(state.index,9);
 if(state.escaped){
  launch=true;escapeAt=performance.now();

 if(n!==expected){tone('wrong');msg('That result does not open the lock. Check your work and try again.');return;}
